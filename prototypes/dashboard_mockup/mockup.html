<title>moon-ai Dashboard Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: top nav of six views; "Today" is the home view (status, needs-you queue, go-live bar, equity). */
:root {
  --bg: #f5f6f4; --panel: #ffffff; --fg: #1b201e; --muted: #67716c; --line: #dadfdb;
  --good: #16856d; --bad: #c4443c; --warn: #b7800f; --accent: #2b5c8e; --soft: rgba(43,92,142,.08);
  --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111513; --panel: #191e1c; --fg: #e2e7e4; --muted: #96a19b; --line: #2b3330;
  --good: #3fc2a1; --bad: #ec6b63; --warn: #e3ad42; --accent: #80b1e4; --soft: rgba(128,177,228,.10); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111513; --panel: #191e1c; --fg: #e2e7e4; --muted: #96a19b; --line: #2b3330;
  --good: #3fc2a1; --bad: #ec6b63; --warn: #e3ad42; --accent: #80b1e4; --soft: rgba(128,177,228,.10); color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px; max-width: 1280px; margin: 0 auto; display: grid; gap: 14px; }
.top { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: baseline; justify-content: space-between; }
.brand { font-weight: 600; font-size: 17px; }
.proto { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--bad); }
nav { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
nav a { color: var(--muted); text-decoration: none; padding: 8px 12px; font-weight: 500; border-bottom: 2px solid transparent; }
nav a[aria-current="page"] { color: var(--fg); border-color: var(--accent); }
nav a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--warn); color: var(--panel); font: 600 11px/18px var(--mono); text-align: center; margin-left: 4px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.g3 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
@media (max-width: 860px) { .g2, .g3 { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; min-width: 0; align-content: start; }
h2 { margin: 0; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
h3 { margin: 0; font-size: 16px; font-weight: 600; }
.status { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 14px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.chip { font: 500 11px var(--mono); padding: 2px 7px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .muted { color: var(--muted); }
.bar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 600px) { .bar { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.req { display: grid; gap: 4px; }
.req .v { font: 500 20px var(--mono); font-variant-numeric: tabular-nums; }
.req .l { font-size: 12px; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; }
.todo { display: grid; gap: 8px; }
.todo div { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; padding: 8px 10px; background: var(--soft); border-radius: 6px; }
.todo a { color: var(--accent); font-weight: 500; white-space: nowrap; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
td.n, th.n { text-align: right; font-family: var(--mono); font-size: 13px; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--soft); }
svg text { font: 10px var(--mono); fill: var(--muted); }
button { font: 500 13px var(--sans); border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); }
.check { display: grid; gap: 4px; font-size: 13px; }
.review { border-left: 3px solid var(--warn); padding-left: 10px; display: grid; gap: 6px; }
.md { max-width: 75ch; line-height: 1.6; }
.md h1 { font-size: 20px; margin: 0 0 4px; } .md h2 { margin-top: 14px; }
.note { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.5; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
</style>

<div class="wrap">
  <div class="top">
    <div><span class="brand">moon-ai</span> <span class="muted">· MNQ · paper replay</span></div>
    <span class="proto">Mockup · sample data · ticket #12</span>
  </div>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>

<script>
// ---------- sample data (deterministic, clearly fake) ----------
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const SETUPS = [
  { id: "ny_am_sb", name: "NY AM Silver Bullet", status: "go-forward" },
  { id: "ny_pm_sb", name: "NY PM Silver Bullet", status: "go-forward" },
  { id: "london", name: "London sweep-and-reverse", status: "rescue pass 4/12" },
  { id: "ote", name: "OTE pullback", status: "insufficient" },
  { id: "m2022", name: "2022 model", status: "retired" },
];
const BUCKETS = ["good trade, won", "good trade, lost", "bad setup, lucky win", "bad trade, lost", "execution issue"];
const trades = []; let day = new Date("2026-08-03");
for (let i = 0; i < 96; i++) {
  day = new Date(day.getTime() + (rnd() < .6 ? 1 : 2) * 864e5); if ([0, 6].includes(day.getDay())) day = new Date(day.getTime() + 2 * 864e5);
  const s = SETUPS[Math.floor(rnd() * (rnd() < .8 ? 2 : 4))];
  const win = rnd() < .45, rr = +(1.6 + rnd() * 1.4).toFixed(2);
  const R = +(win ? rr - .12 : -1.12 - (rnd() < .1 ? .3 : 0)).toFixed(2);
  const p = +(.4 + rnd() * .35).toFixed(2);
  const b = win ? (rnd() < .85 ? 0 : 2) : (rnd() < .7 ? 1 : (rnd() < .6 ? 3 : 4));
  trades.push({ n: i + 1, date: day.toISOString().slice(0, 10), setup: s, dir: rnd() < .5 ? "long" : "short", R, rr, p, model: i < 60 ? "m-0007" : "m-0008", bucket: BUCKETS[b], review: i === 95 ? "pending" : "done" });
}
let eq = 0, peak = 0, maxdd = 0; trades.forEach((t) => { eq += t.R; peak = Math.max(peak, eq); t.eq = +eq.toFixed(2); t.dd = +(eq - peak).toFixed(2); maxdd = Math.min(maxdd, t.dd); });
const RISK_USD = 250, ACCT = 50000; // 0.5% of a $50k account per 1R (sample)
function stats(ts) {
  const w = ts.filter((t) => t.R > 0), l = ts.filter((t) => t.R <= 0);
  const gw = w.reduce((a, t) => a + t.R, 0), gl = -l.reduce((a, t) => a + t.R, 0);
  const net = gw - gl, mean = ts.length ? net / ts.length : 0;
  const sd = Math.sqrt(ts.reduce((a, t) => a + (t.R - mean) ** 2, 0) / Math.max(1, ts.length - 1));
  const dsd = Math.sqrt(l.reduce((a, t) => a + t.R ** 2, 0) / Math.max(1, ts.length));
  let e = 0, pk = 0, dd = 0; ts.forEach((t) => { e += t.R; pk = Math.max(pk, e); dd = Math.min(dd, e - pk); });
  return { n: ts.length, wr: ts.length ? w.length / ts.length : 0, pf: gl ? gw / gl : 0, exp: mean, avgw: w.length ? gw / w.length : 0, dd, sharpe: sd ? mean / sd * Math.sqrt(252 / 1.6) : 0, sortino: dsd ? mean / dsd * Math.sqrt(252 / 1.6) : 0, net };
}
const ALL = stats(trades);
const last = trades[trades.length - 1];
const months = ((new Date(last.date) - new Date("2026-08-03")) / (30.4 * 864e5));

// ---------- helpers ----------
const f = (x, d = 2) => (x >= 0 ? "" : "−") + Math.abs(x).toFixed(d);
const R = (x) => `<span class="${x > 0 ? "good" : "bad"}">${f(x)}R</span>`;
const pct = (x) => (x * 100).toFixed(0) + "%";
function equitySvg(ts, h = 220) {
  const W = 760, top = 10, ddh = 50, bot = 18, left = 40, mainH = h - ddh - bot - top - 8;
  const lo = Math.min(0, ...ts.map((t) => t.eq)), hi = Math.max(...ts.map((t) => t.eq), 1);
  const x = (i) => left + i / (ts.length - 1) * (W - left - 6);
  const y = (v) => top + (hi - v) / (hi - lo) * mainH;
  const dlo = Math.min(...ts.map((t) => t.dd), -1), yd = (v) => top + mainH + 8 + (v / dlo) * ddh;
  const line = ts.map((t, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(t.eq).toFixed(1)}`).join("");
  const dd = `M${x(0)},${yd(0)}` + ts.map((t, i) => `L${x(i).toFixed(1)},${yd(t.dd).toFixed(1)}`).join("") + `L${x(ts.length - 1)},${yd(0)}Z`;
  const ticks = []; for (let v = Math.ceil(lo / 5) * 5; v <= hi; v += 5) ticks.push(`<line x1="${left}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${left - 6}" y="${y(v) + 3}" text-anchor="end">${v}R</text>`);
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="Equity curve in R with drawdown">
    ${ticks.join("")}
    <path d="${line} L${x(ts.length - 1)},${y(lo)} L${x(0)},${y(lo)} Z" fill="var(--soft)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="${x(ts.length - 1)}" cy="${y(ts[ts.length - 1].eq)}" r="3.5" fill="var(--accent)"/>
    <path d="${dd}" fill="var(--bad)" fill-opacity=".25" stroke="var(--bad)" stroke-width="1"/>
    <text x="${left - 6}" y="${yd(0) + 3}" text-anchor="end">0</text><text x="${left - 6}" y="${yd(dlo) + 3}" text-anchor="end">${dlo.toFixed(0)}R</text>
    <text x="${left}" y="${h - 4}">${ts[0].date}</text><text x="${W - 6}" y="${h - 4}" text-anchor="end">${ts[ts.length - 1].date}</text>
  </svg>`;
}
function statRow(name, s, extra = "") {
  return `<td>${name}</td>${extra}<td class="n">${s.n}</td><td class="n">${pct(s.wr)}</td><td class="n">${f(s.pf)}</td><td class="n">${f(s.exp)}R</td><td class="n">${f(s.avgw)}R</td><td class="n">${f(s.dd, 1)}R</td><td class="n">${f(s.sharpe)}</td><td class="n">${f(s.sortino)}</td>`;
}
const STAT_HEAD = `<th class="n">Trades</th><th class="n">Win</th><th class="n">PF</th><th class="n">Exp.</th><th class="n">Avg win</th><th class="n">Max DD</th><th class="n">Sharpe</th><th class="n">Sortino</th>`;

// ---------- views ----------
const PROPOSALS = [
  { id: "P-014", title: "London: try 2-bar close-back for sweeps", kind: "parameter (rescue trial)", stage: "approve to test", from: "weekly report 2026-W43" },
  { id: "P-013", title: "NY PM SB: skip when FOMC minutes at 14:00", kind: "rule", stage: "approve to apply", from: "weekly report 2026-W42", result: "tested: +0.08R exp, 41 trades affected" },
];
const ALERTS = [
  { lvl: "warn", text: "1 Claude review pending (trade #96), retry tonight", link: "#trade-96" },
  { lvl: "warn", text: "Challenger m-0009 in shadow week 3 of 12", link: "#models" },
];
const VIEWS = {
  today() {
    const reqs = [
      { l: "Trades (need 200+)", v: ALL.n, t: 200, ok: ALL.n >= 200, fmt: String(ALL.n) },
      { l: "Months (need 3+)", v: months, t: 3, ok: months >= 3, fmt: months.toFixed(1) },
      { l: "Profit factor (need ≥ 1.3)", v: ALL.pf, t: 1.3, ok: ALL.pf >= 1.3, fmt: f(ALL.pf) },
      { l: "Max drawdown (need ≤ 10%)", v: -ALL.dd * RISK_USD / ACCT, t: .1, ok: -ALL.dd * RISK_USD / ACCT <= .1, fmt: pct(-ALL.dd * RISK_USD / ACCT), inv: true },
    ];
    const lastDay = trades.filter((t) => t.date === last.date);
    return `<div class="grid">
    <div class="status"><span><span class="dot" style="background:var(--good)"></span><b>Last night's replay ran</b> <span class="muted">${last.date} · finished 02:14</span></span>
      <span class="muted">Data ✓ · News calendar ✓ · Reviews 1 pending · Champion <b>m-0008</b></span></div>
    <div class="grid g3">
      <section class="panel"><h2>Go-live bar</h2>
        <div class="bar">${reqs.map((r) => `<div class="req"><span class="v ${r.ok ? "good" : ""}">${r.fmt}</span>
          <div class="meter"><i style="width:${Math.min(100, (r.inv ? (r.t / Math.max(r.v, 1e-9)) : r.v / r.t) * 100)}%;background:var(${r.ok ? "--good" : "--accent"})"></i></div>
          <span class="l">${r.l}</span></div>`).join("")}</div>
        <p class="note">${reqs.filter((r) => r.ok).length} of 4 met. Bar must hold on paper before buying an evaluation.</p>
      </section>
      <section class="panel"><h2>Needs you</h2><div class="todo">
        ${PROPOSALS.map((p) => `<div><span>${p.id} · ${p.title}</span><a href="#proposals">${p.stage}</a></div>`).join("")}
        ${ALERTS.map((a) => `<div><span class="${a.lvl}">${a.text}</span><a href="${a.link}">open</a></div>`).join("")}
      </div></section>
    </div>
    <section class="panel"><h2>Equity (R) and drawdown · all paper trades</h2>${equitySvg(trades)}
      <p class="note">1R = $${RISK_USD} on a $${ACCT / 1000}k account (sample). Net ${f(ALL.net, 1)}R · expectancy ${f(ALL.exp)}R · win rate ${pct(ALL.wr)}.</p></section>
    <div class="grid g2">
      <section class="panel"><h2>Last session · ${last.date}</h2>
        <div class="scroll"><table><tr><th>Setup</th><th>Dir</th><th class="n">R</th><th class="n">ML p</th><th>Review</th></tr>
        ${lastDay.map((t) => `<tr class="click" data-href="#trade-${t.n}"><td>${t.setup.name}</td><td>${t.dir}</td><td class="n">${R(t.R)}</td><td class="n">${t.p}</td><td>${t.review === "pending" ? '<span class="chip warn">pending</span>' : t.bucket}</td></tr>`).join("")}
        </table></div><p class="note">Skipped: 2 (1 ML skip, 1 news blackout). Would-have net: −0.9R.</p></section>
      <section class="panel"><h2>By setup · all paper</h2><div class="scroll"><table><tr><th>Setup</th><th class="n">Trades</th><th class="n">PF</th><th class="n">Exp.</th></tr>
        ${SETUPS.slice(0, 4).map((s) => { const st = stats(trades.filter((t) => t.setup === s)); return `<tr class="click" data-href="#setups"><td>${s.name}</td><td class="n">${st.n}</td><td class="n">${f(st.pf)}</td><td class="n">${f(st.exp)}R</td></tr>`; }).join("")}
      </table></div></section>
    </div></div>`;
  },
  setups() {
    return `<div class="grid"><section class="panel"><h2>Setup library</h2>
      <div class="scroll"><table><tr><th>Setup</th><th>Status</th>${STAT_HEAD}<th class="n">vs random</th><th class="n">DSR</th><th></th></tr>
      ${SETUPS.map((s, i) => { const st = stats(trades.filter((t) => t.setup === s)); const cls = s.status === "go-forward" ? "good" : s.status === "retired" ? "muted" : "warn";
        return `<tr>${statRow(s.name, st, `<td><span class="chip ${cls}">${s.status}</span></td>`)}<td class="n">${["+0.21R", "+0.14R", "+0.03R", "n/a", "−0.02R"][i]}</td><td class="n">${[".97", ".96", ".71", "n/a", ".40"][i]}</td><td><button ${s.status === "retired" ? "disabled" : ""}>Run backtest</button></td></tr>`; }).join("")}
      </table></div>
      <p class="note">Paper-trade metrics. "Run backtest" runs the full protocol (backtest, random-entry baseline, rules-only baseline, DSR/PBO) on the locked defaults and opens its report card. It queues a job; it never changes live rules.</p>
    </section>
    <section class="panel"><h2>Report card · NY AM Silver Bullet · backtest 2019-05 → 2026-04</h2>
      <dl class="kv"><dt>Trades</dt><dd>412</dd><dt>Beats random entries</dt><dd class="good">yes, 95% CI [+0.09R, +0.33R]</dd><dt>DSR</dt><dd class="good">0.97</dd><dt>2× slippage re-run</dt><dd class="good">PF 1.31 (passes)</dd><dt>Params</dt><dd>defaults.yaml @ 3f2a0dd</dd></dl>
    </section></div>`;
  },
  models() {
    const byModel = ["m-0007", "m-0008"].map((m) => [m, stats(trades.filter((t) => t.model === m))]);
    return `<div class="grid"><section class="panel"><h2>Model versions</h2><div class="scroll"><table><tr><th>Model</th><th>Role</th>${STAT_HEAD}</tr>
      <tr>${statRow("rules-only", stats(trades), '<td><span class="chip muted">fallback</span></td>')}</tr>
      ${byModel.map(([m, s]) => `<tr>${statRow(m, s, `<td><span class="chip ${m === "m-0008" ? "good" : "muted"}">${m === "m-0008" ? "champion" : "retired 2026-09-26"}</span></td>`)}</tr>`).join("")}
      <tr><td>m-0009</td><td><span class="chip warn">challenger · shadow wk 3/12</span></td><td class="n" colspan="8">needs ≥150 disagreements over ≥30 sessions: 61 over 14 so far</td></tr>
      </table></div></section>
      <section class="panel"><h2>Health</h2><dl class="kv"><dt>Rolling 60-session vs rules-only</dt><dd class="good">+0.11R/trade, no action</dd><dt>ADWIN (Brier, take rate)</dt><dd class="good">quiet</dd><dt>Holdout checks used</dt><dd>1 (m-0008), next refresh 2027-04</dd><dt>Calibration (Brier)</dt><dd>0.231</dd></dl></section></div>`;
  },
  trades(filter = "all") {
    const list = trades.slice().reverse().filter((t) => filter === "all" || (filter === "losses" ? t.R < 0 : t.bucket === filter));
    return `<section class="panel"><h2>Trades · ${trades.length} paper</h2>
      <div class="filters">${["all", "losses", "bad setup, lucky win", "execution issue"].map((x) => `<button data-filter="${x}" aria-pressed="${x === filter}">${x}</button>`).join("")}</div>
      <div class="scroll"><table><tr><th>#</th><th>Date</th><th>Setup</th><th>Dir</th><th class="n">R</th><th class="n">Planned R:R</th><th class="n">ML p</th><th>Model</th><th>Review</th></tr>
      ${list.slice(0, 40).map((t) => `<tr class="click" data-href="#trade-${t.n}"><td>${t.n}</td><td>${t.date}</td><td>${t.setup.name}</td><td>${t.dir}</td><td class="n">${R(t.R)}</td><td class="n">${t.rr}</td><td class="n">${t.p}</td><td>${t.model}</td><td>${t.review === "pending" ? '<span class="chip warn">pending</span>' : t.bucket}</td></tr>`).join("")}
      </table></div><p class="note">Toggle for skipped candidates (ML skip, cap, blackout, London min stop) lives here too, showing their labelled outcome.</p></section>`;
  },
  trade(n) {
    const t = trades[n - 1]; const thr = (1 / (1 + t.rr - .12)).toFixed(2);
    let s = 3; const bars = Array.from({ length: 60 }, (_, i) => { s += (Math.sin(i / 6) + (i > 30 ? (t.R > 0 ? .5 : -.3) * (t.dir === "long" ? 1 : -1) : 0)); return s; });
    const lo = Math.min(...bars) - 2, hi = Math.max(...bars) + 2, y = (v) => 10 + (hi - v) / (hi - lo) * 180;
    const candles = bars.map((v, i) => { const o = i ? bars[i - 1] : v; const up = v >= o; return `<line x1="${i * 12 + 16}" x2="${i * 12 + 16}" y1="${y(Math.max(o, v) + .8)}" y2="${y(Math.min(o, v) - .8)}" stroke="var(${up ? "--good" : "--bad"})"/><rect x="${i * 12 + 12}" y="${y(Math.max(o, v))}" width="8" height="${Math.max(1, Math.abs(y(o) - y(v)))}" fill="var(${up ? "--good" : "--bad"})"/>`; }).join("");
    return `<div class="grid"><a href="#trades" class="muted">← all trades</a>
    <div class="top"><h3>#${t.n} · ${t.setup.name} · ${t.dir} · ${t.date}</h3><span style="font:500 20px var(--mono)">${R(t.R)}</span></div>
    <div class="grid g3">
      <section class="panel"><h2>Chart · setup window and trade</h2><div class="scroll"><svg viewBox="0 0 740 200" width="100%" role="img" aria-label="Sample trade chart">${candles}
        <line x1="380" x2="740" y1="${y(bars[31])}" y2="${y(bars[31])}" stroke="var(--accent)" stroke-dasharray="4 3"/><text x="690" y="${y(bars[31]) - 4}">entry</text></svg></div>
        <p class="note">Real page: the same chart image Claude reviewed, with sweep, MSS, FVG, entry, stop and target drawn.</p></section>
      <section class="panel"><h2>Rules checklist</h2><div class="check">
        <span class="good">✓ in window (10:00–11:00)</span><span class="good">✓ opposing liquidity swept (asia low)</span><span class="good">✓ MSS on close</span><span class="good">✓ displacement 1.9× ATR with FVG</span><span class="good">✓ objective ≥ 10 pts</span><span class="good">✓ not in news blackout</span><span class="${t.R < 0 ? "warn" : "good"}">${t.R < 0 ? "! stop slipped 3 ticks" : "✓ filled at limit"}</span></div>
        <h2>ML</h2><dl class="kv"><dt>p (calibrated)</dt><dd>${t.p}</dd><dt>take if p &gt;</dt><dd>${thr} (1/(1+net R:R))</dd><dt>model</dt><dd>${t.model}</dd></dl></section>
    </div>
    <div class="grid g2">
      <section class="panel"><h2>Claude review</h2><div class="review"><b>${t.review === "pending" ? "pending" : t.bucket}</b>
        <span>Clean sweep of the Asian low with displacement; entry at the FVG edge. ${t.R < 0 ? "Price returned through the FVG within 4 bars; stop placement was by the rule." : "Target reached at the prior-day high."}</span>
        <span class="muted">reasons: sweep_depth_ticks = 6 · displacement_atr_mult = 1.9 · minutes_since_window_open = 14</span></div>
        <p class="note">Commentary only. Rule-break and execution flags above are computed by code.</p></section>
      <section class="panel"><h2>Fills and costs</h2><dl class="kv"><dt>Entry</dt><dd>limit, filled 10:14</dd><dt>Stop / target</dt><dd>18.25 / ${(18.25 * t.rr).toFixed(2)} pts</dd><dt>Commission</dt><dd>$2.00 round trip</dd><dt>MAE / MFE</dt><dd>−0.6R / ${t.R > 0 ? f(t.R) : "+0.4"}R</dd><dt>Exit</dt><dd>${t.R > 0 ? "target" : "stop"}</dd></dl></section>
    </div></div>`;
  },
  weekly() {
    return `<section class="panel"><div class="md"><h1>Weekly report · 2026-W43</h1><p class="muted">reports/weekly/2026-W43.md · generated Saturday 06:00</p>
      <h2>Summary</h2><p>7 trades, net +2.4R, PF 1.6. NY AM SB 4 trades (+3.1R), NY PM SB 3 trades (−0.7R). Skipped 5 candidates (3 ML, 2 blackout); they would have netted −1.8R.</p>
      <h2>Review buckets</h2><p>good trade, won 3 · good trade, lost 2 · bad setup, lucky win 1 · bad trade, lost 1 · execution issue 0 · failed reviews 0</p>
      <h2>Most instructive trades</h2><p>#91 (bad setup, lucky win): entry after the window close by 1 bar boundary…</p>
      <h2>Shadow comparison</h2><p>Challenger m-0009 agreed on 31 of 36 candidates; on the 5 disagreements it was +1.2R better.</p>
      <h2>Proposals (2)</h2><p>P-014, P-013 → see Proposals.</p></div></section>`;
  },
  proposals() {
    return `<div class="grid">${PROPOSALS.map((p) => `<section class="panel"><div class="top"><h3>${p.id} · ${p.title}</h3><span class="chip warn">${p.stage}</span></div>
      <dl class="kv"><dt>Kind</dt><dd>${p.kind}</dd><dt>From</dt><dd>${p.from}</dd>${p.result ? `<dt>Test result</dt><dd>${p.result}</dd>` : ""}</dl>
      <div class="filters"><button class="primary">${p.stage === "approve to test" ? "Approve test" : "Approve and apply"}</button><button>Reject</button><a href="https://github.com/DaltonDom/moon-ai/issues" class="muted" style="align-self:center">GitHub issue ↗</a></div></section>`).join("")}
      <p class="note">Two approvals per proposal: once to test, once to apply. At most 3 new proposals a week. Each is also a <code>proposal</code> issue on GitHub; the buttons act on that issue.</p></div>`;
  },
};
const NAV = [["today", "Today"], ["setups", "Setups"], ["models", "Models"], ["trades", "Trades"], ["weekly", "Weekly report"], ["proposals", "Proposals"]];
function route() {
  const h = location.hash.slice(1) || "today";
  const tm = h.match(/^trade-(\d+)$/);
  const key = tm ? "trades" : (VIEWS[h] ? h : "today");
  document.getElementById("nav").innerHTML = NAV.map(([k, l]) => `<a href="#${k}" ${k === key ? 'aria-current="page"' : ""}>${l}${k === "proposals" ? `<span class="badge">${PROPOSALS.length}</span>` : ""}</a>`).join("");
  document.getElementById("view").innerHTML = tm ? VIEWS.trade(+tm[1]) : VIEWS[key]();
  window.scrollTo(0, 0);
}
document.addEventListener("click", (e) => {
  const r = e.target.closest("tr[data-href]"); if (r) { location.hash = r.dataset.href; return; }
  const fb = e.target.closest("button[data-filter]"); if (fb) document.getElementById("view").innerHTML = VIEWS.trades(fb.dataset.filter);
});
addEventListener("hashchange", route); route();
</script>
