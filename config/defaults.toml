# moon-ai pre-registered setup defaults.
#
# This file is the pre-registration record (docs/design.md, "Setup testing
# protocol"). It was written before any setup was backtested. Each setup's
# default is tested first; a setup whose default fails gets at most 12 rescue
# trials, listed below in advance, each changing exactly one parameter.
# Every run, defaults included, is logged as a trial for the DSR and PBO.
#
# Don't edit a setup here after its first backtest. A change is a new
# pre-registration, and the trials it adds are counted. The `round2` lists were
# added this way on 2026-11-01, after every setup failed its first test; they
# run with `moon-ai backtest --round2` and count as trials like any other.
#
# Sources: ict-setup-definitions.md §2 and §4 (branch research/ict-setup-definitions),
# ICT timestamps (#21, docs/research/ict-setup-timestamps.md), setup rules (#16),
# ML labels (#9) for the time-outs. Times are New York wall-clock.

[setups.ny_am_silver_bullet]
title = "NY AM Silver Bullet"
priority = 1
# Setup and entry inside 10:00-11:00 (ICT 2023 lecture, tRq1hyGGtl4 08:12-14:10);
# the sweep may come from 09:30. The trade may be held past 11:00.
window = "ny_am_silver_bullet"
sweep_from = "09:30"
timeout = "15:55"
pools = ["opening_range", "overnight", "session_swing"]
# Minimum move on offer to the draw on liquidity, not a take-profit (#21).
min_objective_points = 10.0

  [[setups.ny_am_silver_bullet.rescue]]
  name = "displacement_k_1.0"
  displacement_k = 1.0
  [[setups.ny_am_silver_bullet.rescue]]
  name = "displacement_k_2.0"
  displacement_k = 2.0
  [[setups.ny_am_silver_bullet.rescue]]
  name = "fvg_entry_ce"
  fvg_entry = "ce"
  [[setups.ny_am_silver_bullet.rescue]]
  name = "first_tethered_fvg"
  fvg_selection = "first_tethered"
  [[setups.ny_am_silver_bullet.rescue]]
  name = "min_objective_15"
  min_objective_points = 15.0
  [[setups.ny_am_silver_bullet.rescue]]
  name = "min_objective_20"
  min_objective_points = 20.0
  [[setups.ny_am_silver_bullet.rescue]]
  name = "trade_with_bias_only"
  bias_gate = true
  [[setups.ny_am_silver_bullet.rescue]]
  name = "sweep_close_back_3"
  sweep_close_back_bars = 3
  [[setups.ny_am_silver_bullet.rescue]]
  name = "mss_on_wick"
  mss_break = "wick"
  [[setups.ny_am_silver_bullet.rescue]]
  name = "swing_n_2"
  swing_n = 2
  [[setups.ny_am_silver_bullet.rescue]]
  name = "news_blocks_setup"
  news_handling = "blocks_setup"

  # Round 2, registered 2026-11-01 after the first results (docs/research/why-losing.md).
  [[setups.ny_am_silver_bullet.round2]]
  name = "min_rr_2"
  min_rr = 2.0
  [[setups.ny_am_silver_bullet.round2]]
  name = "timeframe_5m"
  timeframe = 5

