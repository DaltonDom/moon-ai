[setups.london_sweep_and_reverse]
title = "London sweep-and-reverse"
priority = 3
# London killzone 02:00-05:00 (edges still UNVERIFIED, #28). The Judas swing
# takes the Asian range against the previous-day-range bias. The London SB
# 02:00-03:00 variant is dropped (#21: no source has it).
window = "london_killzone"
timeout = "09:30"
pools = ["asia"]
bias_proxy = "prev_day_range"
bias_gate = true
po3_filter = true

  [[setups.london_sweep_and_reverse.rescue]]
  name = "silver_bullet_window_only"
  window = "london_silver_bullet"
  [[setups.london_sweep_and_reverse.rescue]]
  name = "also_prior_day_pools"
  pools = ["asia", "prior_day"]
  [[setups.london_sweep_and_reverse.rescue]]
  name = "no_po3_filter"
  po3_filter = false
  [[setups.london_sweep_and_reverse.rescue]]
  name = "either_side_of_asia"
  bias_gate = false
  [[setups.london_sweep_and_reverse.rescue]]
  name = "displacement_k_1.0"
  displacement_k = 1.0
  [[setups.london_sweep_and_reverse.rescue]]
  name = "displacement_k_2.0"
  displacement_k = 2.0
  [[setups.london_sweep_and_reverse.rescue]]
  name = "fvg_entry_ce"
  fvg_entry = "ce"
  [[setups.london_sweep_and_reverse.rescue]]
  name = "first_tethered_fvg"
  fvg_selection = "first_tethered"
  [[setups.london_sweep_and_reverse.rescue]]
  name = "sweep_close_back_3"
  sweep_close_back_bars = 3
  [[setups.london_sweep_and_reverse.rescue]]
  name = "mss_on_wick"
  mss_break = "wick"
  [[setups.london_sweep_and_reverse.rescue]]
  name = "swing_n_2"
  swing_n = 2

