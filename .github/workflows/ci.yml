name: CI

on:
  # Once per PR and once on main: branch pushes would run it twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Linux only, one Python: macOS minutes cost 10x and burned the free quota.
    # The Mac itself is checked by `moon-ai doctor` and local test runs.
    name: ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Test
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: CLI smoke test
        run: uv run moon-ai download --help
