[project]
name = "moon-ai"
version = "0.1.0"
description = "Autonomous, self-improving ICT trading bot for CME micro futures (backtest engine, data layer, ICT primitives)."
requires-python = ">=3.12"
dependencies = [
    "databento>=0.60",
    "polars>=1.0",
]

[project.scripts]
moon-ai = "moon_ai.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
