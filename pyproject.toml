[project]
name = "moon-ai"
version = "0.1.0"
description = "Autonomous, self-improving ICT trading bot for CME micro futures (backtest engine, data layer, ICT primitives)."
requires-python = ">=3.12"
dependencies = [
    "databento>=0.60",
    "fastapi>=0.110",
    "numpy>=2.0",
    "polars>=1.0",
    "scikit-learn>=1.5",
    "uvicorn>=0.29",
]

[project.scripts]
moon-ai = "moon_ai.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# HTML/CSS template text: long lines and typographic characters are intentional.
"src/moon_ai/backtest/report.py" = ["E501", "RUF001"]
"src/moon_ai/doctor.py" = ["RUF001"]
"src/moon_ai/cli.py" = ["RUF001"]
"src/moon_ai/backtest/protocol.py" = ["E501", "RUF001"]
"src/moon_ai/groundtruth/page.py" = ["E501", "RUF001"]
"src/moon_ai/groundtruth/__init__.py" = ["E501"]
"src/moon_ai/nightly/status.py" = ["RUF001"]
